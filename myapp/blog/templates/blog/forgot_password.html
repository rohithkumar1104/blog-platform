{% extends "blog/base.html" %}

{% block content %}
<style>
    .forgot-password-page {
        min-height: 70vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3rem 1rem;
        background: var(--bs-tertiary-bg);
    }

    .forgot-password-card {
        width: 100%;
        max-width: 460px;
        padding: 2.5rem;
        background: var(--bs-body-bg);
        border: 1px solid var(--bs-border-color);
        border-radius: 1.25rem;
        box-shadow: 0 1rem 2.5rem rgba(0, 0, 0, 0.07);
    }

    .forgot-password-icon {
        width: 58px;
        height: 58px;
        display: grid;
        place-items: center;
        margin: 0 auto 1.25rem;
        border-radius: 1rem;
        background: var(--bs-primary-bg-subtle);
        color: var(--bs-primary);
        font-size: 1.6rem;
    }

    .forgot-password-page .form-control {
        min-height: 48px;
        border-radius: 0.75rem;
    }

    .forgot-password-page .btn {
        min-height: 48px;
        border-radius: 0.75rem;
        font-weight: 600;
    }

    @media (max-width: 576px) {
        .forgot-password-card {
            padding: 1.75rem;
        }
    }
</style>

<div class="forgot-password-page">
    <div class="forgot-password-card">
        <div class="forgot-password-icon">
            <i class="bi bi-shield-lock" aria-hidden="true"></i>
        </div>

        <div class="text-center mb-4">
            <h1 class="h3 fw-bold mb-2">Forgot your password?</h1>
            <p class="text-body-secondary mb-0">
                Enter your email address and we’ll send you a password reset link.
            </p>
        </div>

        {% include 'blog/includes/errors.html' %}

        <form method="post">
            {% csrf_token %}

            <div class="mb-4">
                <label for="email" class="form-label fw-semibold">
                    Email address
                </label>
                <input
                    type="email"
                    class="form-control"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-envelope me-2" aria-hidden="true"></i>
                Send Password Reset Email
            </button>
        </form>

        <div class="text-center mt-4">
            <a href="{% url 'blog:login' %}" class="text-decoration-none small">
                <i class="bi bi-arrow-left me-1" aria-hidden="true"></i>
                Back to login
            </a>
        </div>
    </div>
</div>
{% endblock %}
