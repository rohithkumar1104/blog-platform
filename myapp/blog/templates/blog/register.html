{% extends "blog/base.html" %}

{% block content %}
<style>
    .register-page {
        min-height: 70vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3rem 1rem;
        background: var(--bs-tertiary-bg);
    }

    .register-card {
        width: 100%;
        max-width: 500px;
        padding: 2.5rem;
        background: var(--bs-body-bg);
        border: 1px solid var(--bs-border-color);
        border-radius: 1.25rem;
        box-shadow: 0 1rem 2.5rem rgba(0, 0, 0, 0.07);
    }

    .register-icon {
        width: 58px;
        height: 58px;
        display: grid;
        place-items: center;
        margin: 0 auto 1.25rem;
        border-radius: 1rem;
        background: var(--bs-primary-bg-subtle);
        color: var(--bs-primary);
        font-size: 1.6rem;
    }

    .register-page .form-control {
        min-height: 48px;
        border-radius: 0.75rem;
    }

    .register-page .form-label {
        font-weight: 600;
    }

    .register-page .btn {
        min-height: 48px;
        border-radius: 0.75rem;
        font-weight: 600;
    }

    @media (max-width: 576px) {
        .register-card {
            padding: 1.75rem;
        }
    }
</style>

<div class="register-page">
    <div class="register-card">
        <div class="register-icon">
            <i class="bi bi-person-plus" aria-hidden="true"></i>
        </div>

        <div class="text-center mb-4">
            <h1 class="h3 fw-bold mb-2">Create your account</h1>
            <p class="text-body-secondary mb-0">
                Join the community and start sharing your ideas.
            </p>
        </div>

        {% include 'blog/includes/errors.html' %}

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input
                    type="text"
                    class="form-control"
                    id="username"
                    name="username"
                    value="{{ form.username.value|default:'' }}"
                    placeholder="Choose a username"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input
                    type="email"
                    class="form-control"
                    id="email"
                    name="email"
                    value="{{ form.email.value|default:'' }}"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input
                    type="password"
                    class="form-control"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    required
                >
            </div>

            <div class="mb-4">
                <label for="confirm_password" class="form-label">Confirm password</label>
                <input
                    type="password"
                    class="form-control"
                    id="confirm_password"
                    name="password_confirm"
                    placeholder="Re-enter your password"
                    autocomplete="new-password"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-person-check me-2" aria-hidden="true"></i>
                Create Account
            </button>
        </form>
    </div>
</div>
{% endblock %}
