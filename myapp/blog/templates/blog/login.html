{% extends "blog/base.html" %}

{% block content %}
<style>
    .login-page {
        min-height: 70vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3rem 1rem;
        background: var(--bs-tertiary-bg);
    }

    .login-card {
        width: 100%;
        max-width: 460px;
        padding: 2.5rem;
        background: var(--bs-body-bg);
        border: 1px solid var(--bs-border-color);
        border-radius: 1.25rem;
        box-shadow: 0 1rem 2.5rem rgba(0, 0, 0, 0.07);
    }

    .login-icon {
        width: 58px;
        height: 58px;
        display: grid;
        place-items: center;
        margin: 0 auto 1.25rem;
        border-radius: 1rem;
        background: var(--bs-primary-bg-subtle);
        color: var(--bs-primary);
        font-size: 1.6rem;
    }

    .login-page .form-control {
        min-height: 48px;
        border-radius: 0.75rem;
    }

    .login-page .btn {
        min-height: 48px;
        border-radius: 0.75rem;
        font-weight: 600;
    }

    @media (max-width: 576px) {
        .login-card {
            padding: 1.75rem;
        }
    }
</style>

<div class="login-page">
    <div class="login-card">
        <div class="login-icon">
            <i class="bi bi-person-lock" aria-hidden="true"></i>
        </div>

        <div class="text-center mb-4">
            <h1 class="h3 fw-bold mb-2">Welcome back</h1>
            <p class="text-body-secondary mb-0">
                Log in to continue to your account.
            </p>
        </div>

        {% include 'blog/includes/errors.html' %}

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="alert"
                        aria-label="Close">
                    </button>
                </div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label for="username" class="form-label fw-semibold">
                    Username
                </label>
                <input
                    type="text"
                    class="form-control"
                    id="username"
                    name="username"
                    value="{{ form.username.value|default:'' }}"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="password" class="form-label fw-semibold">
                    Password
                </label>
                <input
                    type="password"
                    class="form-control"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <div class="d-flex justify-content-end mb-4">
                <a href="{% url 'blog:forgot_password' %}" class="small text-decoration-none">
                    Forgot password?
                </a>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-box-arrow-in-right me-2" aria-hidden="true"></i>
                Log In
            </button>
        </form>
    </div>
</div>
{% endblock %}
