{% extends "blog/base.html" %}

{% block content %}
<style>
    .reset-password-page {
        min-height: 70vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3rem 1rem;
        background: var(--bs-tertiary-bg);
    }

    .reset-password-card {
        width: 100%;
        max-width: 460px;
        padding: 2.5rem;
        background: var(--bs-body-bg);
        border: 1px solid var(--bs-border-color);
        border-radius: 1.25rem;
        box-shadow: 0 1rem 2.5rem rgba(0, 0, 0, 0.07);
    }

    .reset-password-icon {
        width: 58px;
        height: 58px;
        display: grid;
        place-items: center;
        margin: 0 auto 1.25rem;
        border-radius: 1rem;
        background: var(--bs-primary-bg-subtle);
        color: var(--bs-primary);
        font-size: 1.6rem;
    }

    .reset-password-page .form-control {
        min-height: 48px;
        border-radius: 0.75rem;
    }

    .reset-password-page .form-label {
        font-weight: 600;
    }

    .reset-password-page .btn {
        min-height: 48px;
        border-radius: 0.75rem;
        font-weight: 600;
    }

    @media (max-width: 576px) {
        .reset-password-card {
            padding: 1.75rem;
        }
    }
</style>

<div class="reset-password-page">
    <div class="reset-password-card">
        <div class="reset-password-icon">
            <i class="bi bi-shield-lock" aria-hidden="true"></i>
        </div>

        <div class="text-center mb-4">
            <h1 class="h3 fw-bold mb-2">Reset your password</h1>
            <p class="text-body-secondary mb-0">
                Choose a new password for your account.
            </p>
        </div>

        {% include 'blog/includes/errors.html' %}

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label for="new_password" class="form-label">New password</label>
                <input
                    type="password"
                    class="form-control"
                    id="new_password"
                    name="new_password"
                    placeholder="Enter your new password"
                    autocomplete="new-password"
                    required
                >
            </div>

            <div class="mb-4">
                <label for="confirm_password" class="form-label">Confirm password</label>
                <input
                    type="password"
                    class="form-control"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Re-enter your new password"
                    autocomplete="new-password"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-check-circle me-2" aria-hidden="true"></i>
                Change Password
            </button>
        </form>

        <div class="text-center mt-4">
            <a href="{% url 'blog:login' %}" class="text-decoration-none small">
                <i class="bi bi-arrow-left me-1" aria-hidden="true"></i>
                Back to login
            </a>
        </div>
    </div>
</div>
{% endblock %}
