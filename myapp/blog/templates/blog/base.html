{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}{{ blog_title|default:"My Blog" }}{% endblock %}</title>

    <meta name="description" content="{% block meta_description %}Stories, ideas, and knowledge from our blog community.{% endblock %}">
    <meta name="theme-color" content="#f8fafc">

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'blog/style.css' %}">

    <style>
        html {
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            background-color: #f8fafc;
        }

        main {
            flex: 1 0 auto;
        }

        footer {
            flex-shrink: 0;
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>

<body>
    {% include "blog/includes/header.html" %}

    <main id="main-content">
        {% block content %}{% endblock %}
    </main>

    {% include "blog/includes/footer.html" %}

    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

    {% block extra_js %}{% endblock %}
</body>
</html>
