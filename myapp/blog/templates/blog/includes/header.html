<header class="site-header bg-dark text-white">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3" href="{% url 'blog:index' %}">
                <i class="bi bi-journal-richtext me-2" aria-hidden="true"></i>
                Blog
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#blogNavbar"
                aria-controls="blogNavbar"
                aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="blogNavbar">
                <div class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                    <a class="nav-link px-lg-3" href="{% url 'blog:index' %}">Home</a>
                    <a class="nav-link px-lg-3" href="{% url 'blog:about' %}">About</a>
                    <a class="nav-link px-lg-3" href="{% url 'blog:contact' %}">Contact</a>

                    {% if user.is_authenticated %}
                        <a class="nav-link px-lg-3" href="{% url 'blog:dashboard' %}">Dashboard</a>
                        <a class="nav-link px-lg-3" href="{% url 'blog:logout' %}">Logout</a>
                    {% else %}
                        <a class="nav-link px-lg-3" href="{% url 'blog:register' %}">Register</a>
                        <a class="btn btn-light text-dark px-3 ms-lg-2 mt-2 mt-lg-0" href="{% url 'blog:login' %}">
                            Login
                        </a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>
</header>
